name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'          # 推送标签时自动触发
  workflow_dispatch:  # 手动触发（推荐测试用）

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 下载模型权重（避免打包后运行时下载）
      - name: Download model weights
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path hivision\creator\weights
          curl.exe -L -o hivision/creator/weights/hivision_modnet.onnx `
            https://github.com/Zeyi-Lin/HivisionIDPhotos/releases/download/weights/hivision_modnet.onnx
          if (Test-Path hivision/creator/weights/hivision_modnet.onnx) {
            Write-Host "✅ Model downloaded successfully."
          } else {
            Write-Error "❌ Model download failed."
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 修正 app.spec 中的脚本路径：将 app/web.py 改为 app.py（不涉及引号，仅替换路径字符串）
      - name: Fix app.spec script path
        shell: pwsh
        run: |
          if (Test-Path app.spec) {
            (Get-Content app.spec) -replace 'app/web\.py', 'app.py' | Set-Content app.spec
            Write-Host "✅ app.spec fixed."
          } else {
            Write-Error "❌ app.spec not found."
            exit 1
          }

      - name: Build with PyInstaller
        run: pyinstaller app.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HivisionIDPhotos-Win
          path: dist/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
