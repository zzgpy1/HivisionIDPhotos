name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download model weights
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path hivision\creator\weights
          curl.exe -L -o hivision/creator/weights/hivision_modnet.onnx `
            https://github.com/Zeyi-Lin/HivisionIDPhotos/releases/download/weights/hivision_modnet.onnx
          if (Test-Path hivision/creator/weights/hivision_modnet.onnx) {
            Write-Host "✅ Model downloaded successfully."
          } else {
            Write-Error "❌ Model download failed."
            exit 1
          }

      - name: Copy model and resources to root
        shell: pwsh
        run: |
          # 确保根目录存在（当前目录就是根）
          Write-Host "Current directory: $(Get-Location)"
          # 复制模型
          Copy-Item -Path "hivision/creator/weights/hivision_modnet.onnx" -Destination "./" -Force
          # 复制所有 CSV 资源文件
          if (Test-Path "hivision/resources") {
            Write-Host "Copying CSV files from hivision/resources..."
            Copy-Item -Path "hivision/resources/*.csv" -Destination "./" -Force -ErrorAction Stop
            Write-Host "✅ CSV files copied."
          } else {
            Write-Warning "hivision/resources directory not found, skipping CSV copy."
          }
          # 列出根目录下的 CSV 和模型文件，以便调试
          Write-Host "Files in root:"
          Get-ChildItem -Path ./ -Filter "*.csv", "*.onnx" -ErrorAction SilentlyContinue | Select-Object Name

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fix app.spec paths
        shell: pwsh
        run: |
          if (Test-Path app.spec) {
            $content = Get-Content app.spec -Raw
            $content = $content -replace 'app/web\.py', 'app.py'
            $content = $content -replace 'hivisionai', 'hivision'
            $content | Set-Content app.spec
            Write-Host "✅ app.spec fixed."
          } else {
            Write-Error "❌ app.spec not found."
            exit 1
          }

      - name: Build with PyInstaller
        run: pyinstaller app.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HivisionIDPhotos-Win
          path: dist/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
