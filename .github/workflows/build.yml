name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 列出根目录所有文件，帮助诊断
      - name: List root directory
        shell: pwsh
        run: |
          Write-Host "Root directory content:"
          Get-ChildItem -Path ./ -Force | Select-Object Name, Mode

      - name: Download model weights
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path hivision\creator\weights
          curl.exe -L -o hivision/creator/weights/hivision_modnet.onnx `
            https://github.com/Zeyi-Lin/HivisionIDPhotos/releases/download/weights/hivision_modnet.onnx
          if (Test-Path hivision/creator/weights/hivision_modnet.onnx) {
            Write-Host "✅ Model downloaded successfully."
          } else {
            Write-Error "❌ Model download failed."
            exit 1
          }

      # 复制所需文件到根目录（模型 + 所有 CSV 文件）
      - name: Copy resources to root
        shell: pwsh
        run: |
          # 复制模型文件
          if (Test-Path hivision/creator/weights/hivision_modnet.onnx) {
            Copy-Item -Path hivision/creator/weights/hivision_modnet.onnx -Destination ./ -Force
            Write-Host "✅ Model copied to root."
          } else {
            Write-Warning "Model not found at hivision/creator/weights/."
          }

          # 搜索整个仓库中所有 .csv 文件并复制到根目录（包括子目录）
          $csvFiles = Get-ChildItem -Path ./ -Recurse -Include *.csv -ErrorAction SilentlyContinue
          if ($csvFiles) {
            foreach ($file in $csvFiles) {
              $dest = Join-Path -Path "./" -ChildPath $file.Name
              Copy-Item -Path $file.FullName -Destination $dest -Force
              Write-Host "Copied $($file.Name) to root."
            }
          } else {
            Write-Warning "No CSV files found in repository."
          }

          # 列出根目录的 CSV 和 ONNX 文件以验证
          Write-Host "Files in root (CSV/ONNX):"
          Get-ChildItem -Path ./ -Include *.csv,*.onnx -ErrorAction SilentlyContinue | Select-Object Name

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fix app.spec paths
        shell: pwsh
        run: |
          if (Test-Path app.spec) {
            $content = Get-Content app.spec -Raw
            $content = $content -replace 'app/web\.py', 'app.py'
            $content = $content -replace 'hivisionai', 'hivision'
            $content | Set-Content app.spec
            Write-Host "✅ app.spec fixed."
          } else {
            Write-Error "❌ app.spec not found."
            exit 1
          }

      - name: Build with PyInstaller
        run: pyinstaller app.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HivisionIDPhotos-Win
          path: dist/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
