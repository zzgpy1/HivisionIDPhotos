name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download model weights
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path hivision\creator\weights
          curl.exe -L -o hivision/creator/weights/hivision_modnet.onnx `
            https://github.com/Zeyi-Lin/HivisionIDPhotos/releases/download/weights/hivision_modnet.onnx
          if (Test-Path hivision/creator/weights/hivision_modnet.onnx) {
            Write-Host "✅ Model downloaded successfully."
          } else {
            Write-Error "❌ Model download failed."
            exit 1
          }

      # ---------- 复制所有资源到根目录（适配 app.spec 中的硬编码路径） ----------
      - name: Copy resources to root
        shell: pwsh
        run: |
          # 复制模型文件到根目录
          if (Test-Path hivision/creator/weights/hivision_modnet.onnx) {
            Copy-Item -Path hivision/creator/weights/hivision_modnet.onnx -Destination ./ -Force
            Write-Host "✅ Model copied to root."
          }
          # 递归查找所有 CSV 文件并复制到根目录
          $csvFiles = Get-ChildItem -Path ./ -Recurse -Include *.csv -ErrorAction SilentlyContinue
          if ($csvFiles) {
            foreach ($file in $csvFiles) {
              Copy-Item -Path $file.FullName -Destination ./ -Force
              Write-Host "Copied $($file.Name) to root."
            }
          }
          # 复制字体文件（如果有）
          $fontFiles = Get-ChildItem -Path ./ -Recurse -Include *.ttf,*.otf -ErrorAction SilentlyContinue
          if ($fontFiles) {
            foreach ($file in $fontFiles) {
              Copy-Item -Path $file.FullName -Destination ./ -Force
              Write-Host "Copied $($file.Name) to root."
            }
          }
          # 列出根目录下的关键文件，以便调试
          Write-Host "Files in root:"
          Get-ChildItem -Path ./ -Include *.onnx,*.csv,*.ttf,*.otf -ErrorAction SilentlyContinue | Select-Object Name

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ---------- 修复 app.spec ----------
      - name: Fix app.spec paths
        shell: pwsh
        run: |
          if (Test-Path app.spec) {
            $content = Get-Content app.spec -Raw
            # 1. 入口脚本路径
            $content = $content -replace 'app/web\.py', 'app.py'
            # 2. 目录名错误
            $content = $content -replace 'hivisionai', 'hivision'
            # 3. 注释掉 icon 行（避免图标文件缺失）
            $lines = $content -split "`r`n"
            $newLines = @()
            $foundIcon = $false
            foreach ($line in $lines) {
              if ($line -match 'icon\s*=\s*["'']?[^,)]*hivision\.ico') {
                Write-Host "Found icon line: $line"
                $newLines += "# " + $line.TrimStart()
                $foundIcon = $true
              } else {
                $newLines += $line
              }
            }
            if ($foundIcon) {
              $content = $newLines -join "`r`n"
              Write-Host "✅ Removed icon line by commenting."
            }
            # 4. 确保 datas 包含整个 hivision 目录（提供额外保障，但根目录已有文件）
            if ($content -notmatch "('hivision', 'hivision')") {
              $content = $content -replace '(datas\s*=\s*\[)', '$1\n    ("hivision", "hivision"),'
              Write-Host "Added hivision directory to datas."
            }
            $content | Set-Content app.spec
            Write-Host "✅ app.spec fixed."
          } else {
            Write-Error "❌ app.spec not found."
            exit 1
          }

      - name: Build with PyInstaller
        run: pyinstaller app.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HivisionIDPhotos-Win
          path: dist/*.exe

      # ---------- 确定 Release 标签 ----------
      - name: Determine release tag
        id: get_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $TAG = "${{ github.ref_name }}"
          } else {
            $TAG = "${{ github.event.inputs.tag }}"
          }
          echo "tag=$TAG" >> $env:GITHUB_OUTPUT
          echo "Determined tag: $TAG"

      # ---------- 创建 GitHub Release ----------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
