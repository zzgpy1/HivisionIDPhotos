name: Build Windows EXE (Manual gradio paths)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download model weights
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path hivision\creator\weights
          curl.exe -L -o hivision/creator/weights/hivision_modnet.onnx `
            https://github.com/Zeyi-Lin/HivisionIDPhotos/releases/download/weights/hivision_modnet.onnx
          if (Test-Path hivision/creator/weights/hivision_modnet.onnx) {
            Write-Host "✅ Model downloaded successfully."
          } else {
            Write-Error "❌ Model download failed."
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install Pillow

      - name: Get gradio and gradio_client paths
        id: gradio_paths
        shell: pwsh
        run: |
          $gradio_path = python -c "import gradio; print(gradio.__path__[0])"
          $gradio_client_path = python -c "import gradio_client; print(gradio_client.__path__[0])"
          echo "GRADIO_PATH=$gradio_path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GRADIO_CLIENT_PATH=$gradio_client_path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "✅ gradio path: $gradio_path"
          Write-Host "✅ gradio_client path: $gradio_client_path"

      - name: Build with PyInstaller (OneDir) including gradio paths
        shell: pwsh
        run: |
          pyinstaller --onedir `
            --add-data "hivision;hivision" `
            --add-data "demo;demo" `
            --add-data "$env:GRADIO_PATH;gradio" `
            --add-data "$env:GRADIO_CLIENT_PATH;gradio_client" `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import demo.processor `
            --hidden-import onnxruntime `
            --hidden-import cv2 `
            --hidden-import numpy `
            --hidden-import gradio `
            --hidden-import gradio_client `
            --name "HivisionIDPhotos" `
            --icon NONE `
            app.py

      - name: Package into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\HivisionIDPhotos\* -DestinationPath HivisionIDPhotos-win.zip
          Write-Host "✅ ZIP created."

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HivisionIDPhotos-Win
          path: HivisionIDPhotos-win.zip

      - name: Determine release tag
        id: get_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $TAG = "${{ github.ref_name }}"
          } else {
            $TAG = "${{ github.event.inputs.tag }}"
          }
          echo "tag=$TAG" >> $env:GITHUB_OUTPUT
          echo "Determined tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: HivisionIDPhotos-win.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
