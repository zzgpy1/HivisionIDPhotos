name: Build Windows EXE (Spec with collect_all fixed)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download model weights
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path hivision\creator\weights
          curl.exe -L -o hivision/creator/weights/hivision_modnet.onnx `
            https://github.com/Zeyi-Lin/HivisionIDPhotos/releases/download/weights/hivision_modnet.onnx
          if (Test-Path hivision/creator/weights/hivision_modnet.onnx) {
            Write-Host "✅ Model downloaded successfully."
          } else {
            Write-Error "❌ Model download failed."
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install Pillow

      - name: Generate and patch spec file
        shell: pwsh
        run: |
          # 生成 spec
          pyi-makespec --onedir --name "HivisionIDPhotos" app.py

          # 读取 spec
          $content = Get-Content HivisionIDPhotos.spec -Raw

          # 1. 在开头添加 collect_all 导入
          $importLine = "from PyInstaller.building.build_main import collect_all`n"
          $content = $importLine + $content

          # 2. 替换 datas 行，使用 collect_all 生成列表
          # 原 datas=[], 替换为 datas = collect_all('gradio') + collect_all('gradio_client') + [('hivision', 'hivision'), ('demo', 'demo')],
          $pattern = '(datas\s*=\s*)\[\]'
          $replacement = "`$1collect_all('gradio') + collect_all('gradio_client') + [('hivision', 'hivision'), ('demo', 'demo')]"
          $content = $content -replace $pattern, $replacement

          # 3. 添加 hiddenimports
          $content = $content -replace '(hiddenimports\s*=\s*\[)', "`$1'PIL','PIL.Image','PIL.ImageDraw','demo.processor','onnxruntime','cv2','numpy','gradio','gradio_client',"

          # 4. 移除 icon
          $content = $content -replace 'icon\s*=\s*["'']?[^,)]*\.ico["'']?', 'icon=None'

          # 保存
          $content | Set-Content HivisionIDPhotos.spec
          Write-Host "✅ spec file patched."

      - name: Build with PyInstaller using spec
        run: pyinstaller HivisionIDPhotos.spec

      - name: Package into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\HivisionIDPhotos\* -DestinationPath HivisionIDPhotos-win.zip
          Write-Host "✅ ZIP created."

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HivisionIDPhotos-Win
          path: HivisionIDPhotos-win.zip

      - name: Determine release tag
        id: get_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $TAG = "${{ github.ref_name }}"
          } else {
            $TAG = "${{ github.event.inputs.tag }}"
          }
          echo "tag=$TAG" >> $env:GITHUB_OUTPUT
          echo "Determined tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: HivisionIDPhotos-win.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
