name: Build Windows EXE (Spec with collect_all)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download model weights
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path hivision\creator\weights
          curl.exe -L -o hivision/creator/weights/hivision_modnet.onnx `
            https://github.com/Zeyi-Lin/HivisionIDPhotos/releases/download/weights/hivision_modnet.onnx
          if (Test-Path hivision/creator/weights/hivision_modnet.onnx) {
            Write-Host "✅ Model downloaded successfully."
          } else {
            Write-Error "❌ Model download failed."
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install Pillow

      # 生成 spec 文件，然后修改
      - name: Generate and patch spec file
        shell: pwsh
        run: |
          # 生成 spec
          pyi-makespec --onedir --name "HivisionIDPhotos" app.py

          # 读取 spec 内容
          $content = Get-Content HivisionIDPhotos.spec -Raw

          # 在 analysis 的 datas 中添加 collect_all 调用
          # 将 `datas=[],` 替换为 datas 列表，包含 collect_all
          $gradioCollect = "collect_all('gradio'), collect_all('gradio_client')"
          # 查找 datas= 行并替换
          $content = $content -replace '(datas\s*=\s*\[)', "`$1`n    $gradioCollect,`n    ('hivision', 'hivision'),`n    ('demo', 'demo'),"

          # 添加必要的 hiddenimports
          $content = $content -replace '(hiddenimports\s*=\s*\[)', "`$1`n    'PIL','PIL.Image','PIL.ImageDraw','demo.processor','onnxruntime','cv2','numpy','gradio','gradio_client',"

          # 修改 exe 的 icon 为 None（避免缺失文件）
          $content = $content -replace 'icon\s*=\s*["'']?[^,)]*\.ico["'']?', 'icon=None'

          # 保存
          $content | Set-Content HivisionIDPhotos.spec
          Write-Host "✅ spec file patched."

      - name: Build with PyInstaller using spec
        run: pyinstaller HivisionIDPhotos.spec

      - name: Package into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\HivisionIDPhotos\* -DestinationPath HivisionIDPhotos-win.zip
          Write-Host "✅ ZIP created."

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HivisionIDPhotos-Win
          path: HivisionIDPhotos-win.zip

      - name: Determine release tag
        id: get_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $TAG = "${{ github.ref_name }}"
          } else {
            $TAG = "${{ github.event.inputs.tag }}"
          }
          echo "tag=$TAG" >> $env:GITHUB_OUTPUT
          echo "Determined tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: HivisionIDPhotos-win.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
