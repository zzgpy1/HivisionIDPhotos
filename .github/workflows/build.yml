name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: List root directory
        shell: pwsh
        run: |
          Write-Host "Root directory content:"
          Get-ChildItem -Path ./ -Force | Select-Object Name, Mode

      - name: Download model weights
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path hivision\creator\weights
          curl.exe -L -o hivision/creator/weights/hivision_modnet.onnx `
            https://github.com/Zeyi-Lin/HivisionIDPhotos/releases/download/weights/hivision_modnet.onnx
          if (Test-Path hivision/creator/weights/hivision_modnet.onnx) {
            Write-Host "✅ Model downloaded successfully."
          } else {
            Write-Error "❌ Model download failed."
            exit 1
          }

      - name: Copy resources to root
        shell: pwsh
        run: |
          if (Test-Path hivision/creator/weights/hivision_modnet.onnx) {
            Copy-Item -Path hivision/creator/weights/hivision_modnet.onnx -Destination ./ -Force
            Write-Host "✅ Model copied to root."
          }
          $csvFiles = Get-ChildItem -Path ./ -Recurse -Include *.csv -ErrorAction SilentlyContinue
          if ($csvFiles) {
            foreach ($file in $csvFiles) {
              $dest = Join-Path -Path "./" -ChildPath $file.Name
              Copy-Item -Path $file.FullName -Destination $dest -Force
              Write-Host "Copied $($file.Name) to root."
            }
          }
          Write-Host "Files in root (CSV/ONNX):"
          Get-ChildItem -Path ./ -Include *.csv,*.onnx -ErrorAction SilentlyContinue | Select-Object Name

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fix app.spec paths
        shell: pwsh
        run: |
          if (Test-Path app.spec) {
            $content = Get-Content app.spec -Raw
            # 修复入口脚本
            $content = $content -replace 'app/web\.py', 'app.py'
            # 修复目录名
            $content = $content -replace 'hivisionai', 'hivision'
            # 查找包含 icon 的行，并注释掉
            $lines = $content -split "`r`n"
            $newLines = @()
            $foundIcon = $false
            foreach ($line in $lines) {
              if ($line -match 'icon\s*=\s*["'']?[^,)]*hivision\.ico') {
                Write-Host "Found icon line: $line"
                # 注释掉该行，并保留原来的缩进
                $newLines += "# " + $line.TrimStart()
                $foundIcon = $true
              } else {
                $newLines += $line
              }
            }
            if ($foundIcon) {
              $content = $newLines -join "`r`n"
              Write-Host "✅ Removed icon line by commenting."
            } else {
              Write-Host "⚠️ No icon line found with hivision.ico, proceeding."
            }
            $content | Set-Content app.spec
            Write-Host "✅ app.spec fixed."
            # 显示修改后的 EXE 部分
            Write-Host "--- app.spec content (EXE part) after fix ---"
            $linesAfter = Get-Content app.spec
            $start = 0
            for ($i=0; $i -lt $linesAfter.Count; $i++) {
              if ($linesAfter[$i] -match '^exe\s*=\s*EXE\(') {
                $start = $i
                break
              }
            }
            if ($start -ge 0) {
              for ($i=$start; $i -lt [Math]::Min($start+15, $linesAfter.Count); $i++) {
                Write-Host $linesAfter[$i]
              }
            }
          } else {
            Write-Error "❌ app.spec not found."
            exit 1
          }

      - name: Build with PyInstaller
        run: pyinstaller app.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HivisionIDPhotos-Win
          path: dist/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
