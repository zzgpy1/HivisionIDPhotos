name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download model weights
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path hivision\creator\weights
          curl.exe -L -o hivision/creator/weights/hivision_modnet.onnx `
            https://github.com/Zeyi-Lin/HivisionIDPhotos/releases/download/weights/hivision_modnet.onnx
          if (Test-Path hivision/creator/weights/hivision_modnet.onnx) {
            Write-Host "✅ Model downloaded successfully."
          } else {
            Write-Error "❌ Model download failed."
            exit 1
          }

      # 将模型和资源文件复制到根目录（因为 app.spec 从根目录引用它们）
      - name: Copy model and resources to root
        shell: pwsh
        run: |
          # 复制模型文件
          Copy-Item hivision/creator/weights/hivision_modnet.onnx ./ -ErrorAction SilentlyContinue
          # 复制所有 CSV 文件（如 size_list_CN.csv, size_list_EN.csv）
          if (Test-Path hivision/resources) {
            Copy-Item hivision/resources/*.csv ./ -ErrorAction SilentlyContinue
            Write-Host "✅ CSV resources copied to root."
          } else {
            Write-Host "⚠️ hivision/resources not found, skipping."
          }
          # 可能需要复制其他资源，如字体等（但先处理 CSV）

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 修正 app.spec 中的两个错误路径：
      #   1. 'app/web.py' → 'app.py'
      #   2. 'hivisionai' → 'hivision'
      - name: Fix app.spec paths
        shell: pwsh
        run: |
          if (Test-Path app.spec) {
            $content = Get-Content app.spec -Raw
            $content = $content -replace 'app/web\.py', 'app.py'
            $content = $content -replace 'hivisionai', 'hivision'
            $content | Set-Content app.spec
            Write-Host "✅ app.spec fixed."
          } else {
            Write-Error "❌ app.spec not found."
            exit 1
          }

      - name: Build with PyInstaller
        run: pyinstaller app.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HivisionIDPhotos-Win
          path: dist/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
